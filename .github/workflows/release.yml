name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.2)"
        required: true

permissions:
  contents: write  # to create GitHub Release + upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: harness
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: harness
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: harness
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Smoke test
        run: ./target/${{ matrix.target }}/release/harness --help

      - name: Package
        run: |
          STAGE="harness-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
          cp README.md LICENSE config.default.toml "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"
          shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          ls -lh "$STAGE.tar.gz"*

      - uses: actions/upload-artifact@v7
        with:
          name: harness-${{ matrix.target }}
          path: |
            harness-*.tar.gz
            harness-*.sha256

  release:
    name: publish release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum -c *.sha256 || shasum -a 256 -c *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            harness-*.tar.gz
            harness-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
