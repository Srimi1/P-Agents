[workspace]
members = [
    "crates/agent_core",
    "crates/harness_core",
    "crates/subagents",
    "crates/runtime",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Harness Developer"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
colored = "2.1"
config = "0.14"
walkdir = "2.5"
ignore = "0.4"
regex = "1.10"
