# Universal Multi-Agent Harness — configuration template.
#
# Copy to ~/.config/harness/config.toml and edit. Every value below is the
# built-in default, so an empty file behaves identically to this one.
#
# Precedence, lowest to highest:
#   these defaults  ->  config.toml  ->  environment  ->  CLI flags
#
# Environment overrides use a HARNESS_ prefix and __ between levels, e.g.
#   HARNESS_PROVIDER__DEFAULT=openai
#   HARNESS_LIMITS__MAX_ITERATIONS=40
#   HARNESS_PERMISSIONS__YOLO=true
# The legacy LLM_BASE_URL and LLM_MODEL variables still override the OpenAI
# provider's settings.

[provider]
# Which provider to use when --provider is not passed: "anthropic" or "openai".
default = "anthropic"

[provider.anthropic]
model = "claude-sonnet-5"
base_url = "https://api.anthropic.com"
# Anthropic requires an explicit output cap on every request.
max_tokens = 8192
# Prefer the ANTHROPIC_API_KEY environment variable. A key set here works but
# logs a warning, because config files get committed by accident.
# api_key = "sk-ant-..."

[provider.gemini]
# Gemini speaks the OpenAI chat format on a compatibility endpoint, so it reuses
# the same client. Key comes from GEMINI_API_KEY.
model = "gemini-2.5-flash"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"

[provider.openai]
# Also covers Ollama, vLLM, LocalAI, DeepSeek, and Gemini's OpenAI-compatible
# endpoint — point base_url at the server and use its model names.
model = "gpt-4o"
base_url = "https://api.openai.com/v1"
# api_key = "sk-..."

[limits]
# Maximum reason/act cycles before an agent gives up on a single request.
max_iterations = 20
# Compaction kicks in as the conversation approaches this many prompt tokens.
max_context_tokens = 128000
# Ceiling on concurrent sub-agents for run_parallel_subagents.
max_parallel_subagents = 4

[permissions]
# Tools that never prompt, even if they declare that they need approval.
auto_approve = ["read_file", "list_directory", "grep_search", "find_files_by_name"]
# Approve every tool call without asking. Intended for CI and scripted runs —
# this lets agents write files and run shell commands unsupervised.
yolo = false

# Confine the file tools to workspace_roots. Reads are never gated by the
# approval prompt, so turning this off lets an agent read any file the process
# can reach. It also survives --yolo, which disables only the prompt.
sandbox = true
# Roots the file tools may touch. Empty means the working directory. Paths must
# already exist; symlinks are resolved, so a link out of a root is refused.
workspace_roots = []

# How far an "always approve" answer reaches.
#   "tool"  — that tool, for every agent, rest of the session (default)
#   "agent" — that tool, only for the agent that was asked
grant_scope = "tool"

[tools]
# Interactive terminal sessions: pty_start, pty_send, pty_close. These let an
# agent drive a program that prompts for input — a REPL, an installer, a
# "are you sure? [y/N]". Off by default for two reasons: it is arbitrary
# interactive execution, and three extra tool schemas ride along on every
# request whether or not the model ever uses them.
interactive_terminal = false

# Extra personas are merged into the roles spawn_subagent accepts, alongside the
# six built-ins (planner, engineer, verifier, critic, researcher, analyst).
# Reusing a built-in name replaces its prompt.
#
# [personas.dba]
# display_name = "DatabaseExpert"
# prompt = """
# You are a database specialist. Review schemas and queries for correctness,
# index coverage, and lock contention. Quote EXPLAIN output when you have it.
# """
